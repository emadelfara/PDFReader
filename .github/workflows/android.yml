name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name pdf_reader .
      - name: Install dependencies
        run: flutter pub get
      - name: Force Android compile SDK 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          if not path.exists():
              path = Path("android/app/build.gradle")
          if not path.exists():
              raise SystemExit("Android app Gradle file was not generated")

          source = path.read_text()
          pattern = r"(?m)^(\s*)compileSdk(?:Version)?\s*(?:=\s*)?.*$"
          replacement = r"\g<1>compileSdk = 36" if path.suffix == ".kts" else r"\g<1>compileSdkVersion 36"
          updated, count = re.subn(pattern, replacement, source)

          if count == 0:
              print("Generated Gradle file:")
              print(source)
              raise SystemExit("Could not find compileSdk declaration")
          
          path.write_text(updated)
          print(f"Updated {path}; compile SDK is now 36")
          print("\n".join(line for line in updated.splitlines() if "compileSdk" in line))
          PY
      - name: Add native PDF renderer
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/pdf_reader
          cp tool/MainActivity.kt android/app/src/main/kotlin/com/example/pdf_reader/MainActivity.kt
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
