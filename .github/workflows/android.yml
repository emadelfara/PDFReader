name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name pdf_reader .
      - name: Install dependencies
        run: flutter pub get
      - name: Force Android compile SDK 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          changed = False
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              if path.suffix == ".kts":
                  updated, count = re.subn(
                      r"(?m)^(\\s*)compileSdk(?:Version)?\\s*(?:=\\s*)?.*$",
                      r"\\g<1>compileSdk = 36",
                      source,
                  )
              else:
                  updated, count = re.subn(
                      r"(?m)^(\\s*)compileSdk(?:Version)?\\s*(?:=\\s*)?.*$",
                      r"\\g<1>compileSdkVersion 36",
                      source,
                  )
              if count:
                  path.write_text(updated)
                  print(f"Updated {path}: compile SDK set to 36")
                  changed = True
                  print("\\n".join(line for line in updated.splitlines() if "compileSdk" in line))
          if not changed:
              raise SystemExit("Could not find compileSdk declaration in generated Android app Gradle file")
          PY
      - name: Add native PDF renderer
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/pdf_reader
          cp tool/MainActivity.kt android/app/src/main/kotlin/com/example/pdf_reader/MainActivity.kt
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
